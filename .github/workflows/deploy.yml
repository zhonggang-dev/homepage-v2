name: Check and deploy official website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements-production.txt
      - run: python -m unittest discover -s tests -v
      - run: python deploy/validate.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://unipat.ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Package verified runtime
        run: python3 deploy/bundle.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/$GITHUB_SHA.tar.gz"
      - name: Configure deployment SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host unipat-production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
      - name: Upload and activate release
        run: |
          set -euo pipefail
          scp "$RUNNER_TEMP/$GITHUB_SHA.tar.gz" "unipat-production:/opt/unipat-official/incoming/$GITHUB_SHA.tar.gz"
          ssh unipat-production "/usr/local/bin/unipat-deploy-release $GITHUB_SHA"
      - name: Verify public HTTPS release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 https://unipat.ai/_health > "$RUNNER_TEMP/health.json"
          python3 -c 'import json, os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/health.json"))["release"] == os.environ["GITHUB_SHA"]'
          printf '### Deployed\n- URL: https://unipat.ai\n- Commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
