<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-labelledby="title desc">
<title id="title">Construction pipeline and expert review</title>
<desc id="desc">Automated checks match an asset to a task, probe it, construct candidate questions, screen them against rules and package a candidate bundle. Experts review and edit the questions, inspect the 3D evidence, record a reference answer and the route taken, then run quality review. Failed records return through a revision and recheck loop, by hand or by an agent, before export.</desc>
