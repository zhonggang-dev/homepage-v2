<link rel="preload" as="script" href="/static/sciencevision/viewer/9a056624/shared/vendor/@niivue/niivue/0.45.0/dist/niivue.umd.js">
<style>
  #gl { width: 100vw; height: calc(100vh - 49px); display: block; position: fixed; top: 49px; left: 0; }
  #view-toggle { position: fixed; top: 60px; right: 12px; background: rgba(13,17,23,0.9); padding: 6px; border-radius: 4px; border: 1px solid #30363d; display: flex; gap: 4px; z-index: 10; }
  #view-toggle button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 10px; border-radius: 3px; font: 11px ui-monospace, monospace; cursor: pointer; }
  #view-toggle button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #view-toggle button:hover:not(.active) { background: #21262d; }
  #gesture-hint { position: fixed; bottom: 12px; left: 12px; background: rgba(13,17,23,0.85); color: #c9d1d9; padding: 5px 9px; border-radius: 4px; border: 1px solid #30363d; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; z-index: 10; pointer-events: none; }
  /* Niivue draws no ruler in 3D volume render — px-per-mm is not single-valued
     once the volume is rotated under perspective. Say so rather than leave the
     reviewer wondering where the scale bar went. */
  #scale-hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(13,17,23,0.85); color: #d29922; padding: 5px 9px; border-radius: 4px; border: 1px solid rgba(210,153,34,.55); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; z-index: 10; pointer-events: none; }
  #scale-hint[hidden] { display: none; }
  /* Voxel index / world RAS mm / per-axis slice for the current crosshair. Many
     medical tasks ask for a coordinate, which is unanswerable from pixels alone. */
  #location-readout { position: fixed; bottom: 12px; right: 12px; min-width: 260px; background: rgba(13,17,23,0.9); color: #f0f3f6; padding: 7px 10px; border: 1px solid #30363d; border-radius: 4px; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; z-index: 10; pointer-events: none; }
  #viewer-mode { color: #79c0ff; }
  @media (max-width: 560px) {
    #view-toggle { right: 10px; max-width: calc(100vw - 20px); flex-wrap: wrap; }
    #gesture-hint { left: 10px; right: 10px; bottom: 8px; text-align: center; }
    #location-readout { left: 10px; right: 10px; bottom: 48px; min-width: 0; }
  }
</style>
<link rel="stylesheet" href="/static/sciencevision/viewer/9a056624/embed.css">
</head>
<body>
<script src="/static/sciencevision/viewer/9a056624/embed.js"></script>
<header class="topbar">
  <div><a class="back" href="/static/sciencevision/viewer/9a056624/">← Shell</a><strong>Niivue</strong> <span id="filename" class="meta"></span></div>
  <div class="meta"><span id="viewer-mode">model</span> · NIfTI · MPR / 3D volume render · trilinear interp</div>
</header>
<canvas id="gl"></canvas>
<div id="view-toggle">
  <button data-mode="render" title="full-screen 3D volume render">3D</button>
  <button data-mode="multiplanar" title="axial / coronal / sagittal triplanar">MPR</button>
  <button data-mode="axial" title="axial slice only">Axial</button>
</div>
<div id="gesture-hint">drag = rotate · wheel = clip · right-drag = pan</div>
<div id="scale-hint">3D render — no scale bar here; switch to MPR or Axial for mm</div>
<div id="location-readout">voxel: -<br>world RAS mm: -<br>slice: -</div>
<script src="/static/sciencevision/viewer/9a056624/shared/vendor/@niivue/niivue/0.45.0/dist/niivue.umd.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const overlay = params.get('overlay');
  const screenshotProvider = window.__ScienceVisionScreenshotProvider;
  const mcpProvider = window.__ScienceVisionViewerMCPProvider;

  // ?mask_id=N restricts a multi-label mask to one label. Without it a task that
  // asks about "the hippocampus head" renders every label at once, and the
  // reviewer cannot tell which voxels the question is about. Kept as the raw
  // string until validated so a malformed value reports itself instead of
  // silently becoming NaN and disabling the filter.
  const rawMaskId = params.get('mask_id');
  const maskId = rawMaskId == null
    ? null
    : (/^(0|[1-9]\d*)$/.test(rawMaskId) ? Number(rawMaskId) : NaN);
  // ?mode=expert marks a human-review route. It is shown in the topbar so a
  // screenshot records which route produced it, and it changes the opening view:
  // expert questions are about slices and coordinates, not the 3D render.
  const routeMode = params.get('mode') === 'expert' ? 'expert' : 'model';
  const VIEWS = ['render', 'multiplanar', 'axial', 'coronal', 'sagittal'];
  const requestedView = params.get('view');
  const initialView = VIEWS.includes(requestedView)
    ? requestedView
    : (routeMode === 'expert' ? 'multiplanar' : 'render');

  function appendError(message) {
    const errorBox = document.createElement('div');
    errorBox.className = 'error-box';
    errorBox.textContent = message;
    document.body.appendChild(errorBox);
  }

  document.getElementById('viewer-mode').textContent = routeMode;
  const maskLabel = overlay
    ? ' + label' + (maskId != null && !Number.isNaN(maskId) ? `#${maskId}` : '')
    : '';
  document.getElementById('filename').textContent = file ? file.split('/').pop() + maskLabel : '(no file)';
  if (!file) {
    const error = new Error('No ?file= query param.');
    appendError(error.message);
    screenshotProvider.fail(error);
    mcpProvider.fail(error);
  } else {
    // niivue 0.45 SLICE_TYPE: AXIAL=0, CORONAL=1, SAGITTAL=2, MULTIPLANAR=3, RENDER=4
    const SLICE = { axial: 0, coronal: 1, sagittal: 2, multiplanar: 3, render: 4 };
    const toggle = document.getElementById('view-toggle');
    const hint = document.getElementById('gesture-hint');
    const scaleHint = document.getElementById('scale-hint');
    const readout = document.getElementById('location-readout');
    const HINTS = {
      render:       'drag = rotate · wheel = clip · right-drag = pan',
      multiplanar:  'drag = pan · wheel = slice · right-drag = window/level',
      axial:        'drag = pan · wheel = slice · right-drag = window/level',
      coronal:      'drag = pan · wheel = slice · right-drag = window/level',
      sagittal:     'drag = pan · wheel = slice · right-drag = window/level',
    };
    let viewMode = initialView;

    /**
     * Rewrite a mask volume in place so only `targetMaskId` survives, as 1 on a
     * background of 0. Returns how many voxels carried that label, so a mask_id
     * absent from this volume is reported rather than shown as an empty overlay.
     */
    function filterOverlayToMaskId(volume, targetMaskId) {
      if (!volume?.img || !ArrayBuffer.isView(volume.img)) {
        throw new Error('Loaded mask has no typed voxel buffer.');
      }
      let selectedVoxelCount = 0;
      for (let index = 0; index < volume.img.length; index += 1) {
        if (Number(volume.img[index]) === targetMaskId) selectedVoxelCount += 1;
      }
      for (let index = 0; index < volume.img.length; index += 1) {
        volume.img[index] = Number(volume.img[index]) === targetMaskId ? 1 : 0;
      }
      // The filtered image is a new binary label volume, independent of the
      // source NIfTI datatype and scaling metadata.
      if (volume.hdr) {
        volume.hdr.scl_slope = 1;
        volume.hdr.scl_inter = 0;
        volume.hdr.cal_min = 0;
        volume.hdr.cal_max = 1;
      }
      volume.cal_min = 0;
      volume.cal_max = 1;
      volume.robust_min = 0;
      volume.robust_max = 1;
      volume.global_min = 0;
      volume.global_max = 1;
      return selectedVoxelCount;
    }

    async function initializeViewer() {
      try {
        const nv = new niivue.Niivue({
          backColor: [0.05, 0.06, 0.09, 1],
          sliceType: SLICE[initialView],
          isColorbar: true,
          isOrientCube: true,
          isNearestInterpolation: false,   // trilinear interpolation — smoother on low-res volumes
          crosshairWidth: 1,
          crosshairColor: [1, 0.35, 0.15, 1],
        });

        // Chrome only, so the initial state can be shown before any GL call and
        // survives a renderer that fails to come up.
        function syncViewChrome(mode) {
          for (const button of toggle.querySelectorAll('button[data-mode]')) {
            button.classList.toggle('active', button.dataset.mode === mode);
          }
          hint.textContent = HINTS[mode] || '';
          viewMode = mode;
          // Only the 3D render lacks a scale bar; the slice views always carry one.
          scaleHint.hidden = mode !== 'render';
        }

        function applyView(mode) {
          nv.setSliceType(SLICE[mode]);
          syncViewChrome(mode);
        }

        function updateReadout(location = null) {
          if (!nv.volumes.length) return;
          const frac = nv.scene.crosshairPos.slice(0, 3);
          const vox = Array.isArray(location?.vox) ? location.vox : nv.frac2vox(frac);
          const mm = Array.isArray(location?.mm) ? location.mm : nv.frac2mm(frac);
          const voxelIndex = Array.from(vox.slice(0, 3), value => Math.round(Number(value)));
          const ras = Array.from(mm.slice(0, 3), value => Number(value).toFixed(2));
          readout.innerHTML = `voxel: [${voxelIndex.join(', ')}]<br>`
            + `world RAS mm: [${ras.join(', ')}]<br>`
            + `slice: sagittal ${voxelIndex[0]} · coronal ${voxelIndex[1]} · axial ${voxelIndex[2]}`;
        }

        // Extra sidecar fields for snapshot-sidecar.js. Kept to what a reviewer
        // would need to re-open this exact view: mode plus crosshair position in
        // mm, plus which label the overlay was narrowed to.
        window.__svSnapshotMeta = () => ({
          view_mode: viewMode,
          crosshair_mm: nv.scene?.crosshairPos
            ? Array.from(nv.frac2mm(nv.scene.crosshairPos), Number)
            : null,
          route_mode: routeMode,
          mask_id: document.body.dataset.maskFilter === 'applied' ? maskId : null,
        });

        toggle.addEventListener('click', event => {
          const button = event.target.closest('button[data-mode]');
          if (button) applyView(button.dataset.mode);
        });
        // The constructor already opened on initialView; this only marks it.
        syncViewChrome(initialView);

        const volumes = [{ url: file, opacity: 1.0 }];
        if (overlay) {
          if (Number.isNaN(maskId)) {
            appendError('mask_id must be a non-negative integer.');
          } else {
            volumes.push({ url: overlay, opacity: 0.5, colormap: 'red' });
          }
        }

        await nv.attachTo('gl');
        nv.onLocationChange = updateReadout;
        await nv.loadVolumes(volumes);

        if (maskId != null && !Number.isNaN(maskId) && nv.volumes[1]) {
          const maskVolume = nv.volumes[1];
          let selectedVoxelCount = 0;
          try {
            selectedVoxelCount = filterOverlayToMaskId(maskVolume, maskId);
          } catch (error) {
            // A mask we could not filter must not be shown unfiltered: that
            // would look like an answer to a question about one label.
            maskVolume.opacity = 0;
            nv.updateGLVolume();
            throw error;
          }
          nv.updateGLVolume();
          if (selectedVoxelCount === 0) {
            throw new Error(`mask_id ${maskId} is absent from the loaded mask.`);
          }
          document.body.dataset.maskFilter = 'applied';
          document.body.dataset.maskId = String(maskId);
        }
        updateReadout();
        window.__svPostReady?.();

        // After loadVolumes: the bar labels its unit from the NIfTI header, and
        // there is no header to read until a volume is in.
        window.ScienceVisionInstallNiiVueScaleBar(nv);
        mcpProvider.ready(window.__ScienceVisionCreateNiiVueMCPProvider(nv));
        screenshotProvider.ready(() => {
          const canvas = nv.canvas || document.getElementById('gl');
          if (!canvas || !canvas.width || !canvas.height) {
            throw new Error('NiiVue render canvas is unavailable.');
          }
          nv.drawScene();
          return new Promise((resolve, reject) => {
            canvas.toBlob(blob => {
              if (blob) resolve(blob);
              else reject(new Error('NiiVue could not encode its render canvas.'));
            }, 'image/png');
          });
        });
      } catch (err) {
        screenshotProvider.fail(err);
        mcpProvider.fail(err);
        appendError(`Failed to load:\n${err instanceof Error ? err.message : String(err)}`);
      }
    }

    initializeViewer();
  }
</script>
</body>
</html>
